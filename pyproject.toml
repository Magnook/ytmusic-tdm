[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-dl"
version = "0.1.0"
description = "Baixador de música do YouTube + letras sincronizadas, feito para Termux"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47.0",
    "syncedlyrics>=1.0.0",
]

[project.scripts]
ytmusic = "ytmusic.cli:main"

[tool.setuptools]
packages = ["ytmusic"]
